[project]
name = "mightycode-workspace"
version = "0.1.0"
description = "MightyCode – a terminal-native AI coding agent (workspace root)"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv]
dev-dependencies = [
    "ruff>=0.12.0",
    "pyright>=1.1.400",
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/shared/tests", "packages/cli/tests", "packages/server/tests"]
addopts = "--import-mode=importlib"
