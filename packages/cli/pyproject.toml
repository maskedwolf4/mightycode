[project]
name = "mightycode-cli"
version = "0.1.0"
description = "MightyCode CLI – a Textual-based terminal coding agent"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "textual>=3.2.0",
    "mightycode-shared",
]

[project.scripts]
mightycode = "mightycode_cli.main:main"

[tool.uv.sources]
mightycode-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mightycode_cli"]
