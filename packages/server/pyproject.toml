[project]
name = "mightycode-server"
version = "0.1.0"
description = "MightyCode Server – FastAPI backend for the coding agent"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "mightycode-shared",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "alembic>=1.15.0",
    "cryptography>=44.0.0",
    "httpx>=0.27.0",
    "openai>=1.50.0",
    "anthropic>=0.39.0",
]

[tool.uv.sources]
mightycode-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mightycode_server"]
