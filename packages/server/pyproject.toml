[project]
name = "mightycode-server"
version = "0.1.0"
description = "MightyCode Server – FastAPI backend for the coding agent"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "mightycode-shared",
]

[tool.uv.sources]
mightycode-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mightycode_server"]
