[project]
name = "mightycode-shared"
version = "0.1.0"
description = "Shared Pydantic models and contracts for MightyCode"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mightycode_shared"]
